name: Reproduce analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install Python and R dependencies
        run: make install

      - name: Snapshot committed outputs
        run: cp -r outputs "$RUNNER_TEMP/outputs_committed"

      - name: Re-run analysis, figures and manuscript build
        run: make all

      - name: Check outputs reproduce
        run: python tests/check_reproducibility.py "$RUNNER_TEMP/outputs_committed"

      - name: Upload submission files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-build
          path: manuscript/build/
